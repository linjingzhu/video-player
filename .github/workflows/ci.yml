name: CI

on:
  pull_request:
    branches:
      - stable
  push:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: dotnet build VideoPlayer.sln -c Release

      - name: Test
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: dotnet test tests/VideoPlayer.Tests/VideoPlayer.Tests.csproj -c Release --no-build

      - name: Fetch libmpv
        shell: pwsh
        run: |
          $lines = @(& dotnet msbuild tests/VideoPlayer.Smoke/VideoPlayer.Smoke.csproj -nologo -getProperty:TargetDir -p:Configuration=Release)
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the smoke output directory." }
          $dest = ($lines | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Last 1).ToString().Trim()
          if (-not (Test-Path -LiteralPath $dest)) { throw "Smoke output directory does not exist: $dest" }
          ./scripts/fetch-libmpv.ps1 -Destination $dest

      - name: Engine and window smoke
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          IESEO_REQUIRE_LIBMPV: "1"
        run: dotnet run --project tests/VideoPlayer.Smoke/VideoPlayer.Smoke.csproj -c Release --no-build
