name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Package Release zip
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $env:PACKAGE_VERSION = $env:DISPATCH_TAG
          } elseif ($env:REF_TYPE -eq "tag") {
            $env:PACKAGE_VERSION = $env:REF_NAME
          } else {
            $env:PACKAGE_VERSION = ""
          }
          ./scripts/package-release.ps1

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Ieseo-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $env:PACKAGE_VERSION = $env:DISPATCH_TAG
          } elseif ($env:REF_TYPE -eq "tag") {
            $env:PACKAGE_VERSION = $env:REF_NAME
          } else {
            $env:PACKAGE_VERSION = ""
          }
          $ErrorActionPreference = "Stop"
          $tag = $env:PACKAGE_VERSION.Trim()
          if ($tag -notmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Refusing to publish. Tag must look like v1.2.3 (got '$tag')."
          }

          $zip = Get-ChildItem -Path artifacts -Filter *.zip -File | Select-Object -First 1
          if (-not $zip) {
            throw "No zip was produced under artifacts/."
          }

          $notes = "Windows x64 build of 이어서.`n`nUnzip and run Ieseo.exe. The archive is self-contained (no separate .NET install). It includes libmpv-2.dll, ffmpeg.exe for webp/gif clip export, vulkan-1.dll, which those binaries import, and yt-dlp.exe beside Ieseo.exe. Source URLs and checksums are in THIRD-PARTY.txt inside the zip."

          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
          }
          else {
            gh release create $tag $zip.FullName --target $env:GITHUB_SHA --title "이어서 $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }

          Write-Host "Published $($zip.Name) to release $tag"
