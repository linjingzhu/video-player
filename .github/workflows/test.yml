name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test portable core
        run: dotnet test tests/VideoPlayer.Tests/VideoPlayer.Tests.csproj --configuration Release
